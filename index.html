<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-5">

    <div class="card shadow p-4 text-center">

        <h1 class="mb-4">Rock Paper Scissors</h1>

        <div class="mb-4">
            <button class="btn btn-primary m-2" onclick="playGame('Rock')">✊ Rock</button>
            <button class="btn btn-success m-2" onclick="playGame('Paper')">✋ Paper</button>
            <button class="btn btn-danger m-2" onclick="playGame('Scissors')">✌ Scissors</button>
        </div>

        <h4 id="userChoice">Your Choice:</h4>
        <h4 id="computerChoice">Computer Choice:</h4>

        <h3 class="mt-3" id="result">Result</h3>

        <hr>

        <div class="row">
            <div class="col">
                <h5>User Score</h5>
                <h3 id="userScore">0</h3>
            </div>

            <div class="col">
                <h5>Computer Score</h5>
                <h3 id="computerScore">0</h3>
            </div>
        </div>

        <button class="btn btn-warning mt-4" onclick="resetGame()">
            Reset Game
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
